<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wp { position: absolute; inset: 0; }
</style>
</head>
<body>
<!--
  壁纸宿主页 —— **它跑在 sandbox iframe 里（不给 allow-same-origin），是不透明源**。

  ⛔ 别把它搬进主页面：场景壁纸里的 SceneScript 是**别人的代码**（webwallgl 的脚本沙箱
  只是 JS 语义上的隔离，不是安全边界）。放进不透明源的 iframe 之后，它连父窗口的
  `window` 都拿不到，也就永远碰不到 `window.__TAURI_INTERNALS__`（读文件、写文件那一套）。

  协议（父 → 这里）
    {type:'hello'} —— 「你起来了吗」，收到就回一条 boot
    {type:'mount', pkg: ArrayBuffer, project: object|null, key: string, fps?: number}
    {type:'pause'} {type:'resume'} {type:'volume', v: number} {type:'destroy'}
  协议（这里 → 父）
    {type:'boot'} {type:'status', message} {type:'ready', info} {type:'error', message}
    {type:'diagnostic', message}

  ⚠️ **boot 必须能被再问一次**（上面的 `hello`）。这里加载完就主动 post 一条 boot，
  但父窗口那个监听器是 React 的 effect 注册的、晚于本页脚本执行，所以**重启工作站时
  那条 boot 常常没有人听见** —— 表现就是「这一次打开背景是黑的/不动的」。父窗口起来
  之后会问一次 `hello`，这里如实再回一条。少了这条应答，开场那次错过就永远接不上。

  ⚠️ 只走 `bytesSource`：宿主已经用 IPC 把 `scene.pkg` 的字节读出来了，这里**不许**联网，
  也不用 Tauri 的 asset 协议（不透明源下那属于跨源请求，没必要）。
-->
<div id="wp"></div>
<script>
/* ⛔ **必须先把 `caches` 盖成 undefined，再加载 webwallgl。**
   沙箱（没有 allow-same-origin）里读 `window.caches` **不是回 undefined，而是直接抛**
   SecurityError（`Cache storage is disabled because the context is sandboxed…`），
   而库的缓存层是用 `typeof caches` 判可用性的 —— 属性一被碰就抛，它那句 try/catch
   兜的是 `caches.open`，兜不住「读属性就抛」，于是整个 `mount()` 失败、一张图都不画。
   盖成 undefined 之后 `typeof caches === 'undefined'`，它自动退到内存缓存。
   ⚠️ 别图省事给 iframe 加 `allow-same-origin`：那会让壁纸里的 SceneScript 与宿主同源，
   顺着 `parent.__TAURI_INTERNALS__` 就能读写用户的文件。 */
Object.defineProperty(window, 'caches', {value: undefined, configurable: true})
</script>
<script src="./webwallgl.min.js"></script>
<script>
(() => {
  'use strict'
  const box = document.getElementById('wp')
  let inst = null

  const post = (m) => { try { parent.postMessage(m, '*') } catch (_) { /* 父窗口没了 */ } }
  const text = (e) => String((e && (e.message || e.stack)) || e)

  addEventListener('message', async (ev) => {
    const d = ev.data || {}
    try {
      if (d.type === 'hello') { post({ type: 'boot' }); return }
      if (d.type === 'mount') {
        if (inst) { inst.destroy(); inst = null }
        post({ type: 'status', message: '装配场景…' })
        inst = await WebWallGL.mount(box, {
          source: WebWallGL.bytesSource(d.pkg, d.project || undefined, d.key || undefined),
          fit: 'cover',
          /* 30fps：这是背景层，上面还压着玻璃材质（backdrop-filter）。实测帧率上限是
             省 CPU 最有效的那一档（上游数字：场景壁纸稳态 CPU -25~38%）。 */
          fps: d.fps || 30,
          volume: 0,
          autoQuality: true,
          /* ⛔ **必须关掉贴图烘焙**：它默认把解码好的贴图存进 Cache API，而
             Cache storage 在「沙箱 + 没有 allow-same-origin」的上下文里是禁用的 ——
             开着的话 mount() 直接抛
             `Failed to read the 'caches' property from 'Window'`，一张图都画不出来。
             ⚠️ 别为了这个给 iframe 加 `allow-same-origin`：那样壁纸里的 SceneScript
             就和宿主同源了，能顺着 `parent.__TAURI_INTERNALS__` 读写用户的文件。
             代价只是重复加载时多几百毫秒解码（上游实测 52 张内嵌图 94ms → 470ms）。 */
          bake: false,
          onError: (e) => post({ type: 'error', message: text(e) }),
          onDiagnostic: (x) => post({ type: 'diagnostic', message: text((x && x.message) || x) }),
        })
        post({ type: 'ready', info: inst.info, fps: inst.stats && inst.stats.fps })
        return
      }
      if (d.type === 'pause') { if (inst) inst.pause(); return }
      if (d.type === 'resume') { if (inst) inst.resume(); return }
      if (d.type === 'volume') { if (inst) inst.setVolume(d.v || 0); return }
      if (d.type === 'destroy') { if (inst) { inst.destroy(); inst = null } return }
    } catch (e) {
      post({ type: 'error', message: text(e) })
    }
  })

  post({ type: 'boot' })
})()
</script>
</body>
</html>
