# 编译 + 打包 macOS 安装包（DMG）
#
# 手动跑：Actions → 打包 macOS (DMG) → Run workflow
#   勾上 release 就顺手把 DMG 传到 Release 上（只有 tag 触发才需要勾，平时留空即可）
# 打 tag 跑：`git tag v1.3.3 && git push origin v1.3.3` —— 与 MSI 那条并行，互不影响
#
# ── 为什么只出 arm64 ──────────────────────────────────────────────────────────
#
# `macos-latest` 是 Apple Silicon（macOS 26 arm64）。随包的二进制（ffmpeg / yt-dlp /
# LibreSVIP CLI / onnxruntime）由 `tools/fetch_tools.mjs` 按**构建机架构**取，
# 所以这个包装出来是 arm64 的：能装进 Intel Mac，但一调 ffmpeg 就会失败。
# 要让 Intel 也能用，得先让那个脚本按**目标**架构取件（现在按 `process.arch`），
# 再把两个架构 lipo 起来 —— 那是另一件事，没做之前别把这里改成 universal。
#
# ── 没有 Apple 证书，也就不需要任何 secret ─────────────────────────────────────
#
# 不签名的 .app 在 Apple Silicon 上仍能跑（链接器给的 ad-hoc 签名够启动用），
# 只是从浏览器下的 dmg 带 quarantine 属性，第一次要右键 →「打开」放行。
# 想消掉这一步要有开发者证书 + 公证，那是发布流程的事，与构建无关。

name: 打包 macOS (DMG)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译成功后把 DMG 上传到 Release（打 tag 时必勾）'
        type: boolean
        default: false
      verbose:
        description: '打开 tauri 的详细日志（打包失败时用来定位）'
        type: boolean
        default: false
  push:
    # 与 MSI 那条同一套 tag 规则：带数字才不会误触发随手建的 v-something
    tags: ['v[0-9]*']

permissions:
  contents: write          # tag 触发时要把 DMG 传上 Release，需要写权限

jobs:
  dmg:
    name: 编译并打包 DMG
    # Apple Silicon；`macos-latest` 现在就是它（见文件头「为什么只出 arm64」）
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # ⚠️ 顺序不能反：`setup-node` 的 `cache: pnpm` 要求 pnpm 已经装好
      - name: 装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # 仓库自己的两张表、以及仓库与 workflow 的漂移 —— 这些在本地跑不到（YAML 读不到
      # JS 常量），只会在 CI 里炸，而那时每轮要等十几分钟。放在最前面，早失败。
      #
      # 壁纸握手那一条是**跑脚本**、不是查表：宿主页那条 `boot` 在重启时常常早于父窗口的
      # 监听器，所以它必须能被父窗口再问一次（见 tools/check_wallpaper_handshake.mjs）。
      # 这条坏掉的表现是「重启后背景不动」，而它在编译期完全看不出来。
      - name: 核对仓库与 workflow 一致
        run: |
          node tools/check-artifact-paths.mjs
          node tools/check_assets_agree.mjs
          node tools/check_wallpaper_handshake.mjs

      - name: 装前端依赖
        run: pnpm install --frozen-lockfile

      # ffmpeg 的 macOS 可携包是 `.tar.xz`，而 Node 没有 liblzma（见 tools/archive.mjs）——
      # 解它要系统的 `xz`。镜像里通常自带，没有就装一个（`brew` 在 arm64 上是
      # /opt/homebrew，别写死路径）。
      - name: 确保有 xz（解 ffmpeg 的 .tar.xz 用）
        run: command -v xz >/dev/null || brew install xz

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # 两块产物（tools/ 与 public/vendor/jizura/）由 `beforeBuildCommand`
      # （= `pnpm prepare:assets && pnpm build`）在 **cargo build 之前**补齐，这里不再
      # 单独 fetch 一遍。补齐在这条路径上是**硬失败**：macOS 上`prepare-assets.mjs`
      # 缺件直接退出 1（不像 `dev` 只警告），所以少件不会走到打包。
      - name: 编译并打包
        env:
          TAURI_LOG: ${{ inputs.verbose && 'debug' || '' }}
        run: pnpm exec tauri build --bundles app,dmg

      # DMG 文件名里的 `beta` 只能在这里补：Cargo.toml 是 `1.3.2`，产物天生叫
      # `v-synth-studio_1.3.2_aarch64.dmg`，而用户看到的版本（`config_file.rs::APP_VERSION`）
      # 是 `1.3.2beta`。与 MSI 那条同一套规矩。
      - name: DMG 文件名加 beta
        run: |
          set -euo pipefail
          old=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          new=$(echo "$old" | sed -E 's#(v-synth-studio_[0-9]+\.[0-9]+\.[0-9]+)_#\1beta_#')
          if [ "$new" = "$old" ]; then
            echo "DMG 名字没匹配上版本段，改名正则要跟着 productName 改：$old" >&2
            exit 1
          fi
          mv "$old" "$new"
          echo "DMG: $new"

      # ⚠️ 与 MSI 那条一样：产物**先**传成 build artifact，再跑冒烟。这样万一冒烟红了，
      #    DMG 仍然能在 Actions 页面下载到（少一次「白等十分钟什么都没拿到」）。
      - name: 传 DMG（build artifact）
        uses: actions/upload-artifact@v7
        with:
          name: v-synth-studio-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error      # 没打出 DMG 却"成功"，比失败更糟

      # 让「装出来是对的」有证据，而不是只看编译退出码。macOS 上这件事比 MSI 那边好办 ——
      # `.app` 就是个目录，直接查里面有什么，不用去读安装包的 File 表。
      #
      # ⚠️ 路径按 `bundle.resources` 的**映射目标名**写：`tauri.conf.json` 里把
      #    ../data/resources.json 映射成 data/resources.json，落点就是
      #    `Contents/Resources/data/resources.json` —— 与 `lib.rs::resolve_paths`
      #    查的是同一个路径。
      #
      # ⚠️ 前端与 jizura **不在这里面**：`frontendDist = dist/` 被 tauri-codegen
      # 嵌进可执行文件，磁盘上查不到。所以它靠**体积**兜一道（见下面第四条）。
      - name: 冒烟（查 .app 里的产物 + 架构 + 体积）
        run: |
          set -euo pipefail
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          RES="$APP/Contents/Resources"
          BIN="$APP/Contents/MacOS/v-synth-studio"
          echo "app: $APP"
          # 出问题时第一眼要看的就是这棵树，所以先打一层（`sed` 读全量，不用 `head`：
          # 下游提前关管道会给上游 SIGPIPE，配上 `pipefail` 就是假失败）
          find "$RES" -maxdepth 2 -mindepth 1 | sort | sed -n '1,25p'

          # ① `bundle.resources` 真去装的那几项（名字按平台走：mac 上不带 .exe、
          #    动态库是 lib*.dylib）。少打包是**静默**的，所以逐条查。
          for f in data/resources.json data/pinyin.json \
                   tools/ffmpeg/bin/ffmpeg \
                   tools/yt-dlp \
                   tools/libresvip/libresvip-cli/libresvip-cli \
                   tools/onnxruntime/libonnxruntime.dylib; do
            [ -f "$RES/$f" ] || { echo "✗ .app 里少了 $RES/$f"; exit 1; }
          done

          # ② LibreSVIP 的插件目录不能是空壳 —— exe 在、插件没在 = 工程格式互转认不出
          #    任何格式，而且不报错。
          n=$(find "$RES/tools/libresvip/libresvip-cli/_internal/libresvip/plugins" -type f | wc -l | tr -d ' ')
          echo "LibreSVIP 插件 $n 个文件"
          [ "$n" -gt 50 ] || { echo "✗ 插件只有 $n 个文件，明显少打包了"; exit 1; }

          # ③ 随包的二进制必须是 arm64。取错平台（或取到 Intel 版）在编译期看不出来，
          #    到用户手里才现形 —— 这是这一层最该拦的一件事。
          for b in "$RES/tools/ffmpeg/bin/ffmpeg" \
                   "$RES/tools/yt-dlp" \
                   "$RES/tools/libresvip/libresvip-cli/libresvip-cli" \
                   "$RES/tools/onnxruntime/libonnxruntime.dylib" \
                   "$BIN"; do
            file "$b" | grep -q 'arm64' || { echo "✗ 架构不对：$(file "$b")"; exit 1; }
          done

          # ④ 可执行文件的体积：前端（含 2335 个字体，约 64 MB）嵌在里面。
          #    下面的下限拦的是「dist/ 是空的 / 很旧」这种大错，不是精确核对。
          sz=$(stat -f%z "$BIN")
          echo "可执行文件 $((sz / 1024 / 1024)) MB"
          [ "$sz" -gt 40000000 ] || { echo "✗ 太小，前端/jizura 没嵌进去"; exit 1; }

          # ⑤ **真把它们跑一遍**。架构对不对、动没动态库、包解出来完不完整 ——
          #    只有真执行才知道，而这些都是到用户手里才现形的那一类。
          FF="$RES/tools/ffmpeg/bin/ffmpeg"
          ver=$("$FF" -version 2>&1)
          echo "$ver" | sed -n '1p'
          # 音频页要用的编码器必须都在（LGPL/GPL 构建的差别就在这儿）
          encs=$("$FF" -hide_banner -encoders 2>/dev/null)
          for e in libmp3lame libopus libvorbis aac flac; do
            echo "$encs" | grep -q "[[:space:]]$e[[:space:]]" || { echo "✗ ffmpeg 里没有 $e"; exit 1; }
          done
          "$RES/tools/yt-dlp" --version
          # LibreSVIP 的包里有 4 条符号链接（`_internal/Python` 等），解压器没建出来的话
          # 这一句就会失败 —— 这正是工程格式互转在 mac 上能不能用的判据。
          svip=$("$RES/tools/libresvip/libresvip-cli/libresvip-cli" plugin detail svp 2>&1)
          echo "$svip" | sed -n '1,3p'

          echo "布局、架构与总量都对 ✓"

      - name: 传 DMG 到 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
