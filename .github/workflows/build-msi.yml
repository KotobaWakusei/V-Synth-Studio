# 编译 + 打包 Windows 安装包（MSI）
#
# 手动跑：Actions → 打包 Windows (MSI) → Run workflow
#   勾上 release 就顺手把 MSI 传到 Release 上（只有 tag 触发才需要勾，平时留空即可）
# 打 tag 跑：`git tag v1.2.0 && git push origin v1.2.0` —— 自动编译并把 MSI 传上 Release
#
# ⚠️ 首次推送后这个文件可能不会被 Actions 索引（Actions 页是空的、`total_count = 0`，
#    但文件在树上、Actions 权限也是开的）。**空提交没用** —— 必须改到这个文件本身
#    （路径进 `.github/workflows/**`）才会被重新解析注册，而且只有被改动的那一个文件会注册。
#
# ── 这个仓库里没有任何大二进制 ──────────────────────────────────────────────
#
# 源码不到 7MB。两块「随程序分发但不属于源码」的大件不入库，由编译前的步骤补进工作区：
#
#   tools/                      ffmpeg 105MB + LibreSVIP 13MB + yt-dlp 18MB ≈ 188MB
#   public/vendor/jizura/       index.html + LICENSE（上游直取）+ 2335 个 woff2 ≈ 50MB
#
# 两块由 `pnpm exec tauri build` 的 `beforeBuildCommand`（= `pnpm prepare:assets`）补齐：
#
#   tools/    ← ffmpeg / yt-dlp / LibreSVIP / onnxruntime，各自上游发布点直取
#               （URL 在 `fetch_tools.mjs::UPSTREAM`，按平台分列；这里是 win-x64）
#   jizura/   ← 上游源码（github.com/852wa/JIZURA，按 commit 直取）+ Google Fonts
#
# 都不缓存：上游 URL 决定内容，缓存只会多一层可能过期的状态。
#
# ── 编译链上的几条硬约束 ────────────────────────────────────────────
#
# **不做 `cargo install tauri-cli`**：`@tauri-apps/cli` 已在 devDependencies 里，
# `pnpm exec tauri` 直接可用。
#
# **不需要 Python**：`tools/` 全是 Node 脚本（`tools/*.mjs`），补齐与两个检查都跑在
# 已有的 Node 上 —— 所以这个 workflow 不再有 `actions/setup-python`。
#
# **`bundle.resources` 里没有前端**：`frontendDist` 是 `dist/`，被 Tauri
# **嵌进 exe**（`tauri-codegen`）。所以 jizura 的文件**不会出现在 MSI 的 File 表里**，
# 冒烟测试不能用「查 File 表里有没有 index.html」当判据（查不出来），见下面「冒烟」那步。
#
# **没有 `ffprobe.exe`**：媒体信息由 `ffmpeg -i` 自己读（见 audio.rs）。
#
# **版本号只有一处**：`src-tauri/Cargo.toml`。`tauri.conf.json` 不写 `version`，
# Tauri 会自己用 Cargo 的值；界面上显示的那个也从 `CARGO_PKG_VERSION` 取。
# 版本号是什么就是什么，不改 MSI 文件名。

name: 打包 Windows (MSI)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译成功后把 MSI 上传到 Release（打 tag 时必勾）'
        type: boolean
        default: false
      verbose:
        description: '打开 tauri 的详细日志（打包失败时用来定位）'
        type: boolean
        default: false
  push:
    # 版本 tag 是 `v1.2.0` 这种。带数字是为了不误触发：宽泛的 `v*` 会连
    # 「随手建的 v-something」也一起跑。
    tags: ['v[0-9]*']

permissions:
  contents: write          # tag 触发时要把 MSI 传上 Release，需要写权限

jobs:
  # ── 编译 + 打包 + 冒烟 ────────────────────────────────────────────────────
  msi:
    name: 编译并打包 MSI
    # windows-latest 上预装了 MSVC + Windows SDK（链接需要）、Node.js、Edge。
    runs-on: windows-latest
    timeout-minutes: 120   # release 编译 + 含 ~240MB 资源的 MSI 打包（主要是压缩慢）

    steps:
      - uses: actions/checkout@v7

      - name: 装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      # Node 既是前端构建（Vite）要的，也是 `tools/*.mjs` 要的 —— 全仓不再依赖 Python。
      # Vite 8 要求 Node 20.19+ / 22.12+。
      - name: 装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # 仓库与 workflow 自身对不对得上 —— 这类漂移在本地跑不到（YAML 读不到 JS 常量），
      # 只会在 CI 里炸，而那时每轮要等十几分钟。放在前面，早失败。
      # 两个检查只用 Node 内建模块，所以放在 `pnpm install` 之前也行。
      #
      # 最后那条是**跑脚本**而不是查表：壁纸宿主页的 `boot` 在重启时常常早于父窗口的
      # 监听器，所以它必须能被再问一次。坏掉的表现是「重启后背景不动」，编译期看不出来。
      - name: 核对仓库与 workflow 一致
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/check-artifact-paths.mjs
          if ($LASTEXITCODE -ne 0) { throw "check-artifact-paths.mjs 失败" }
          node tools/check_assets_agree.mjs
          if ($LASTEXITCODE -ne 0) { throw "check_assets_agree.mjs 失败" }
          node tools/check_wallpaper_handshake.mjs
          if ($LASTEXITCODE -ne 0) { throw "check_wallpaper_handshake.mjs 失败" }

      - name: 装前端依赖
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: 装 Rust（stable + MSVC）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 缓存 cargo。含 ~240MB 资源的 MSI 每次都要重新打包，但增量编译能省下大头
      # （第一次跑会慢，之后就快了）。
      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # 两块产物（tools/ 与 public/vendor/jizura/）与前端都由 `beforeBuildCommand`
      # （= `pnpm prepare:assets && pnpm build`）在 **cargo build 之前**补齐 —— 那是唯一
      # 正确的位置：字体要先进 `public/`，Vite 才可能把它拷进 `dist/`，`dist/` 才可能被
      # `tauri-codegen` 读进去嵌进二进制。这里不再单独 fetch / build 一遍。
      #
      # ⚠️ 顺序反了**不报错**，只会打出一个缺字体的包 —— 所以下面冒烟那步还会用
      #    **exe 体积**兜一道。补齐失败时 `prepare:assets` 退出 1，这一步照样会红。

      # `pnpm exec tauri` 而不是 `cargo tauri`：CLI 在 devDependencies 里，
      # 不需要 `cargo install tauri-cli`，也不需要为它单独缓存或预编译。
      - name: 编译并打包
        shell: pwsh
        env:
          # tauri 的详细日志。打包失败时最有用的是它的 Wix 那几行输出。
          TAURI_LOG: ${{ inputs.verbose && 'debug' || '' }}
        run: pnpm exec tauri build

      # 安装包文件名里的 `beta` 只能在这里补。
      # Windows Installer 的 `ProductVersion` 只吃纯数字 `x.y.z`，所以 `Cargo.toml`
      # 是 `1.3.2`、MSI 天生叫 `v-synth-studio_1.3.2_x64_zh-CN.msi`；而用户要的名字
      # 与界面显示的版本（`config_file.rs::APP_VERSION`）都带 `beta`。
      # ⚠️ 改名必须在下面几步**之前**：冒烟要求「恰好一个 MSI」，传 artifact 与传
      #    Release 都按 `*.msi` 取，改完名这三处都跟着走。
      - name: MSI 文件名加 beta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi')[0]
          # 名字形如 v-synth-studio_1.3.2_x64_zh-CN.msi → 在版本段后面补 beta
          $new = $old.Name -replace '^(v-synth-studio_[0-9]+\.[0-9]+\.[0-9]+)_', '$1beta_'
          if ($new -eq $old.Name) { throw "MSI 名字没匹配上版本段，改名正则要跟着 productName 改：$($old.Name)" }
          Rename-Item $old.FullName $new
          Write-Host "MSI: $new"

      # ⚠️ 产物**先**传成 build artifact，再跑冒烟：这样万一冒烟红了，MSI 仍然能在
      #    Actions 页面下载到（少一次「白等 30 分钟什么都没拿到」）。传 Release 仍在冒烟之后。
      - name: 传 MSI（build artifact）
        uses: actions/upload-artifact@v7
        with:
          name: v-synth-studio-msi
          # target 目录被 .gitignore 忽略，但 artifact 是文件系统层面的，照传不误
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error      # 没打出 MSI 却"成功"，比失败更糟

      - name: 传 exe 安装程序（build artifact）
        uses: actions/upload-artifact@v7
        with:
          name: v-synth-studio-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 让「编出来的东西真的能装、装出来是对的」有个证据，而不是只看编译退出码。
      #
      # jizura 的文件在盘上（Vite 要把它拷进 `dist/`），但它**不在** `bundle.resources`
      # 里 —— `frontendDist = dist/` 由 `tauri-codegen` **嵌进 exe**，所以 MSI 的
      # File 表里既没有 `index.html`、也没有任何 jizura 文件。别去 File 表里查它们。
      #
      # 所以判据分两层：
      #   ① MSI 的 File 表里该有的（`bundle.resources` 那几项 + 程序本体）
      #   ② 嵌入资源的**证据**：exe 的体积。2335 个 woff2（50MB）与前端产物都压在里面，
      #      而「忘了建 dist」或「build 早于 fetch」会让它明显变小。这不是精确核对
      #      （做不到：资源在 exe 内部，MSI 表里看不见），是**拦大错**。
      #      精确核对在 `build.rs` 里（它在 cargo build 时会逐个查源文件在不在）。
      - name: 冒烟（读 MSI 表 + exe 体积）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi')
          if ($msi.Count -ne 1) { throw "期望恰好一个 MSI，实际 $($msi.Count) 个" }
          $msi = $msi[0].FullName
          Write-Host ("MSI: {0}   {1:N1} MB（压缩后）" -f $msi, ((Get-Item $msi).Length / 1MB))

          # exe 安装程序：与 MSI 同一个程序的另一种装法，也一起传 Release。
          # 只查「恰好一个 + 体积下限」—— 它的内容与 MSI 同源（同一份 exe 打出来的），
          # 真要逐件核对在 MSI 那边已经做了。
          $setup = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($setup.Count -ne 1) { throw "期望恰好一个 exe 安装程序，实际 $($setup.Count) 个" }
          $setupMb = $setup[0].Length / 1MB
          Write-Host ("exe 安装程序：{0}   {1:N1} MB" -f $setup[0].Name, $setupMb)
          if ($setupMb -lt 100) { throw "exe 安装程序只有 $([math]::Round($setupMb, 1)) MB，明显少打包了" }

          # ⚠️ 两条姿势：SQL 的列名要**反引号**；
          #    InvokeMember 的每个返回值都要 $null = 接住，否则会混进函数输出。
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT `File`, `FileName`, `FileSize` FROM `File`'))
          $null = $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)

          # 一遍收完：行数、名字、逐个体积、总体积。别为了拿某一项的体积再查一遍
          # （同一个视图再跑一次 = 同一份逻辑写两遍，改一处忘一处的那种重复）。
          #
          # ⚠️ **「多少文件」必须数行，不能数 `$sizes.Count`。** `FileName` 不是唯一的：
          #    libresvip 那棵 Python 树里 `__init__.py` 出现 51 次、`options.py` 45 次、
          #    `model.py` 32 次…… 用 `$sizes.Count` 会少算 299 个（实测 1096 vs 1395），
          #    而这条判据正是「少打包了没有」——少算就等于把防线拆了。
          #    `$sizes` 只用来查「某个名字的文件在不在」，判总量/个数一律用行数。
          $sizes = @{}                       # 长名 → 字节数（只用于 ContainsKey）
          $rows = 0                          # 真实文件数（File 表的行数）
          $total = 0
          while ($true) {
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if (-not $rec) { break }
            $rows++
            $fn = [string]$rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 2)
            $sz = [int]$rec.GetType().InvokeMember('IntegerData', 'GetProperty', $null, $rec, 3)
            $total += $sz
            if ($fn -match '\|') { $fn = ($fn -split '\|')[-1] }   # FileName 是「短名|长名」
            $sizes[$fn] = $sz
          }
          Write-Host ("File 表：{0} 个文件（{1} 个不同文件名），{2:N1} MB（未压缩）" -f $rows, $sizes.Count, ($total / 1MB))

          # ① `bundle.resources` 真去装的那几个 + 程序本体。
          #    **不要**加 `index.html` / `ffprobe.exe` —— 前者走 `frontendDist`
          #    嵌在 exe 里、不在磁盘上，后者不由我们的产物表产出。加了必然误报。
          $need = 'v-synth-studio.exe', 'resources.json', 'pinyin.json',
                  'ffmpeg.exe', 'yt-dlp.exe', 'libresvip-cli.exe', 'onnxruntime.dll'
          $miss = @($need | Where-Object { -not $sizes.ContainsKey($_) })
          if ($miss.Count) { throw "MSI 里少了：$($miss -join '、') —— bundle.resources 少打包是静默的" }

          # ② 个数与总量下限。**这几个数要按仓库里的实际内容算**，不能凭印象写。
          #
          #    2026-10-06 Windows 本机实测（就是这两个判据的标定值）：
          #        File 表 1,395 行 / 262.1 MB（未压缩），程序本体 59.3 MB
          #      `tools/` 那份 ≈183 MB 是主体，`libresvip` 一棵树就占 1,375 个文件。
          #
          #    ⚠️ 两个坑：
          #      · 别把 jizura 的文件数/体量算进来 —— 它走 `frontendDist`（嵌进 exe），
          #        File 表里看不见它们，只有 exe 的体积能反映。
          #      · 下限要留出余量：它拦的是「映射少写一条」这种大错，不是「少了一个插件」。
          if ($rows -lt 1150) { throw "MSI 里只有 $rows 个文件，明显少打包了（实测 ≈1395）" }
          if ($total -lt 150MB) { throw "MSI 内容只有 $([math]::Round($total / 1MB, 1)) MB，明显少打包了（实测 ≈262MB）" }

          # ③ exe 本身的体积：前端（含 2335 个字体，约 64MB）嵌在里面。
          #    本机 Linux release 实测 61.8MB；Windows 上（WebView2 + MSVC）会更大。
          #    40MB 这条拦的是「dist/ 是空的/很旧」—— 那种情况下 exe 只有几十 MB 的一半。
          if (-not $sizes.ContainsKey('v-synth-studio.exe')) { throw 'MSI 里没有 v-synth-studio.exe' }
          $exeMb = $sizes['v-synth-studio.exe'] / 1MB
          Write-Host ("程序本体 {0:N1} MB（前端与 jizura 嵌在里面）" -f $exeMb)
          if ($exeMb -lt 40) {
            # ⚠️ 双引号字符串里**不要写反引号**：PowerShell 里反引号是转义符
            #    （`` `f `` 是换页符），`frontendDist` 这种写法会被吃掉一个字。
            #    要强调就用「」。
            throw ("程序本体只有 {0:N1} MB —— 嵌入的前端/jizura 太小了。「dist/」是在 " +
                   "cargo build 时被 tauri-codegen 嵌进 exe 的，只有它为空或很旧才会这么小。" +
                   "检查 pnpm exec tauri build 有没有正常跑它的 beforeBuildCommand（pnpm build）。" -f $exeMb)
          }
          Write-Host '布局与总量都对 ✓'

      - name: 传 MSI 与 exe 安装程序到 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v3
        with:
          # 两个都传：README 里列的就是两种装法，而以前 exe 得手工往 Release 上补
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
